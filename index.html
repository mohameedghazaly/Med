<title>MedTrack</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Arabic:wght@400;600&family=IBM+Plex+Sans:wght@400;500;600&family=Schibsted+Grotesk:wght@600;700;800&display=swap">
<style>
/* Layout: phone-first app shell. Sticky header, scrolling view, fixed bottom tab bar. Six tabs, one shared state. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#F5F7FB; --ink:#0F172A; --muted:#5B6577; --line:#D9DEE8;
  --accent:#3047E0; --accent-ink:#FFFFFF; --accent-soft:#E3E7FD;
  --good:#16875B; --good-soft:#DDF3EA; --warn:#A8690B; --warn-soft:#FBEBCF; --bad:#C2362F; --bad-soft:#F9DEDC;
  --grid:#E9D9DE; --grid-strong:#DDBFC8;
  --f-display:"Schibsted Grotesk","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --r:14px; --r-sm:9px; --nav-h:64px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A0E17; --surface:#131926; --surface-2:#192031; --ink:#E8ECF5; --muted:#98A2B6; --line:#232C3E;
  --accent:#8296FF; --accent-ink:#0A0E17; --accent-soft:#1D2547;
  --good:#47C98F; --good-soft:#12342A; --warn:#E5A84B; --warn-soft:#3A2B10; --bad:#F07B73; --bad-soft:#40181A;
  --grid:#2A1F27; --grid-strong:#3A2A34; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A0E17; --surface:#131926; --surface-2:#192031; --ink:#E8ECF5; --muted:#98A2B6; --line:#232C3E;
  --accent:#8296FF; --accent-ink:#0A0E17; --accent-soft:#1D2547;
  --good:#47C98F; --good-soft:#12342A; --warn:#E5A84B; --warn-soft:#3A2B10; --bad:#F07B73; --bad-soft:#40181A;
  --grid:#2A1F27; --grid-strong:#3A2A34; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;padding-inline:16px;padding-block:0 calc(var(--nav-h) + 24px + env(safe-area-inset-bottom,0px));-webkit-text-size-adjust:100%}
.wrap{max-width:720px;margin-inline:auto}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.num{font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.muted{color:var(--muted)} .small{font-size:12.5px} .label{font-family:var(--f-mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}

/* header */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px 10px}
.top h1{font-size:22px;font-weight:800}
.top .sub{font-size:12.5px;color:var(--muted)}
.ask-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);border-radius:999px;padding:9px 15px;font-weight:600;font-size:14px}
.sample-banner{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--warn-soft);color:var(--ink);border-radius:var(--r-sm);padding:9px 12px;font-size:13px;margin-bottom:12px}
.sample-banner button{border:0;background:var(--ink);color:var(--bg);border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;white-space:nowrap}

/* cards */
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.card h2{font-size:16px;font-weight:700}
.card-head{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:10px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.stat{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.stat .num{font-size:24px;line-height:1.1;display:block;margin-top:2px}
.stat .unit{font-size:12.5px;color:var(--muted);font-weight:500}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:99px;background:var(--accent)}
.bar.good>i{background:var(--good)} .bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.between{justify-content:space-between}
.row>.grow{flex:1;min-width:0}
.wrapflex{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 9px;font-size:12px;font-weight:600;background:var(--accent-soft);color:var(--accent);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good)} .pill.warn{background:var(--warn-soft);color:var(--warn)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.list{display:flex;flex-direction:column}
.list>.item{display:flex;align-items:center;gap:10px;padding-block:9px;border-top:1px solid var(--line);min-width:0}
.list>.item:first-child{border-top:0;padding-top:0}
.list>.item .grow{flex:1;min-width:0;overflow-wrap:anywhere}
.done-text{text-decoration:line-through;color:var(--muted)}

/* controls */
.btn{border:1px solid var(--line);background:var(--surface);border-radius:var(--r-sm);padding:8px 13px;font-weight:600;font-size:14px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.small{padding:5px 10px;font-size:13px}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad)}
.icon-btn{border:0;background:transparent;color:var(--muted);padding:6px;border-radius:8px;line-height:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.field label{font-size:12px;color:var(--muted)}
input[type=text],input[type=number],input[type=date],select,textarea{width:100%;min-width:0;background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 10px;font-size:15px}
textarea{resize:vertical;min-height:84px}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end}
input[type=checkbox]{appearance:none;width:22px;height:22px;border:2px solid var(--muted);border-radius:7px;background:transparent;flex:none;display:grid;place-content:center;margin:0}
input[type=checkbox]:checked{background:var(--good);border-color:var(--good)}
input[type=checkbox]:checked::after{content:"";width:6px;height:11px;border:solid var(--bg);border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.seg{display:flex;gap:4px;background:var(--surface-2);border-radius:var(--r-sm);padding:3px;overflow-x:auto}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 10px;font-weight:600;font-size:13px;color:var(--muted);white-space:nowrap}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.scroll-x{overflow-x:auto}
input[type=file]{width:100%;font-size:13px}
.photos{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.photos figure{margin:0;min-width:0}
.photos img{display:block;width:100%;max-width:100%;aspect-ratio:3/4;object-fit:cover;border-radius:var(--r-sm);background:var(--surface-2)}
.photos figcaption{display:flex;align-items:center;justify-content:space-between;font-size:12px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th{font-family:var(--f-mono);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);text-align:left;font-weight:500;padding:6px 8px;white-space:nowrap}
td{padding:7px 8px;border-top:1px solid var(--line);white-space:nowrap}
td.num-c,th.num-c{text-align:right}

/* ecg journey */
.ecg{background-color:var(--surface);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),linear-gradient(var(--grid-strong) 1px,transparent 1px),linear-gradient(90deg,var(--grid-strong) 1px,transparent 1px);background-size:12px 12px,12px 12px,60px 60px,60px 60px;border:1px solid var(--line);border-radius:var(--r-sm);overflow:hidden}
.ecg svg{display:block;width:100%;height:auto}
.journey{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;font-family:var(--f-display);font-weight:700;font-size:20px}
.journey .arrow{color:var(--muted);font-weight:500}
.journey .match{color:var(--good)}

/* week */
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.week .d{background:var(--surface-2);border-radius:8px;padding:6px 0;text-align:center;font-size:11px;color:var(--muted)}
.week .d b{display:block;font-size:15px;color:var(--ink);font-family:var(--f-display)}
.week .d.today{outline:2px solid var(--accent)}
.week .d.hit{background:var(--good-soft)}

/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,minmax(0,1fr));padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 2px 8px;font-size:10.5px;font-weight:600;color:var(--muted);height:var(--nav-h)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--accent)}

/* sheet + toast */
.scrim{position:fixed;inset:0;background:rgba(5,8,15,.5);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:50;background:var(--surface);border-radius:20px 20px 0 0;max-height:88%;display:flex;flex-direction:column;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:720px;margin-inline:auto;border:1px solid var(--line)}
.sheet .body{overflow-y:auto;display:flex;flex-direction:column;gap:12px;padding-block:10px}
.answer{background:var(--surface-2);border-radius:var(--r-sm);padding:12px;white-space:pre-wrap;overflow-wrap:anywhere;font-size:14.5px;max-height:46vh;overflow-y:auto}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:9px 15px;border-radius:99px;font-size:13.5px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.empty{padding:14px;text-align:center;color:var(--muted);font-size:13.5px;border:1px dashed var(--line);border-radius:var(--r-sm)}
@media (prefers-reduced-motion:no-preference){.bar>i{transition:width .4s ease}}
@media (max-width:380px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
</style>
</head><body>
<div class="wrap">

<script>
(function(){
const $=(s,r)=>(r||document).querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');

const addDays=(k,n)=>{const d=new Date(k+'T12:00:00');d.setDate(d.getDate()+n);return dkey(d)};
const daysBetween=(a,b)=>Math.round((new Date(b+'T12:00:00')-new Date(a+'T12:00:00'))/864e5);
const TODAY=dkey();

const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
const usd=n=>'$'+Math.round(n||0).toLocaleString('en-US');
const sum=(a,f)=>a.reduce((s,x)=>s+(+(f?f(x):x)||0),0);
const SYSTEMS=['Cardiology','Pulmonology','Renal','Gastroenterology','Endocrine','Neurology','Biostatistics','Ethics','Microbiology','Pharmacology','Biochemistry','Immunology','Hematology/Oncology','MSK/Derm','Reproductive','Psychiatry'];
const fmtDate=(k,o)=>new Date(k+'T12:00:00').toLocaleDateString('en-US',o||{month:'short',day:'numeric'});

function baseState(){return{
  v:1,updatedAt:0,sample:false,
  usmle:{examDate:'',targetQ:3000,targetScore:75,studyGoal:240,uw:[],nbme:[],plan:[]},
  days:{},
  school:{subjects:[],events:[]},
  road:{stages:[
    {id:'s1',name:'Step 1',status:'doing',date:'',notes:''},
    {id:'s2',name:'Step 2 CK',status:'todo',date:'',notes:''},
    {id:'s3',name:'ECFMG certification',status:'todo',date:'',notes:''},
    {id:'s4',name:'USCE / observership',status:'todo',date:'',notes:''},
    {id:'s5',name:'ERAS application',status:'todo',date:'',notes:''},
    {id:'s6',name:'Interviews',status:'todo',date:'',notes:''},
    {id:'s7',name:'Match',status:'todo',date:'',notes:''}],

function sampleState(){
  const s=baseState();s.sample=true;
  const T=TODAY,d=n=>addDays(T,n);
  s.usmle.examDate=d(150);
  s.usmle.plan=[
    {id:uid(),date:T,t:'UWorld 40 Q, Renal block',done:true},
    {id:uid(),date:T,t:'Surgery: acute abdomen review',done:true},
    {id:uid(),date:T,t:'Anki reviews',done:false},

  const sysSeq=[['Cardiology',40,22],['Renal',40,21],['Biostatistics',20,8],['Pulmonology',40,22],['Endocrine',40,24],['Neurology',40,23],['Microbiology',40,24],['Biostatistics',20,9],['Pharmacology',40,25],['Renal',40,24],['Gastroenterology',40,26],['Cardiology',40,27],['Ethics',20,15],['Pulmonology',40,26],['Renal',40,26]];

  const study=[150,180,120,200,90,160,140,170,130,190,150,160,175,120];
  const prot=[158,162,149,171,140,166,155,168,152,170,160,165,158,142];
  const kc=[2250,2310,2180,2340,2090,2300,2260,2330,2210,2290,2320,2270,2310,2100];
  const wk=['Push','Pull','Legs','','Push','Pull','Legs','','Push','Pull','Legs','','Push','Pull'];
  const sub=['Surgery','Internal Medicine','Pediatrics','Surgery','Internal Medicine','Surgery','Pediatrics','Surgery','Internal Medicine','Surgery','Pediatrics','Internal Medicine','Surgery','Surgery'];
  for(let i=0;i<14;i++){
    const k=d(-13+i);
    s.days[k]={study:[{subject:sub[i],min:study[i]}],workout:wk[i],protein:prot[i],kcal:kc[i],anki:i===13?0:(70+((i*37)%90))};

  s.school.subjects=[
    {id:'sj1',name:'Surgery',topics:[
      {t:'Acute abdomen',done:true},{t:'Hernias',done:true},{t:'Trauma and ATLS',done:true},{t:'Breast lumps',done:false},{t:'Thyroid nodules',done:false},{t:'Burns',done:false}]},
    {id:'sj2',name:'Internal Medicine',topics:[
      {t:'Chest pain',done:true},{t:'Heart failure',done:true},{t:'COPD and asthma',done:false},{t:'DKA',done:false},{t:'Anemia work-up',done:false}]},
    {id:'sj3',name:'Pediatrics',topics:[
      {t:'Neonatal jaundice',done:false},{t:'Vaccination schedule',done:false},{t:'Fever in children',done:false},{t:'Congenital heart disease',done:false}]}
  ].map(x=>(x.topics=x.topics.map(t=>({id:uid(),t:t.t,done:t.done,note:'',link:''})),x));
  s.school.events=[
    {id:uid(),date:d(3),title:'Surgery grand round',type:'Lecture'},
    {id:uid(),date:d(9),title:'Surgery end-of-rotation exam',type:'Exam'},
    {id:uid(),date:d(20),title:'Pediatrics OSCE',type:'Exam'}];
  s.road.stages[0].date=d(150);
  s.road.stages[0].status='doing';
  s.road.usce=[{id:uid(),place:'Example hospital',type:'Observership',state:'TX',status:'Planning'}];
  s.road.states=['Texas','New York','Florida'].map(n=>({id:uid(),name:n,req:'',salary:'',notes:''}));
  s.money.items=[
    {id:uid(),cat:'UWorld',label:'UWorld subscription',cost:400,paid:true},
    {id:uid(),cat:'NBME',label:'NBME assessments',cost:120,paid:true},
    {id:uid(),cat:'Exam fees',label:'Step 1 exam fee',cost:1000,paid:false},
    {id:uid(),cat:'Exam fees',label:'ECFMG fees',cost:600,paid:false},
    {id:uid(),cat:'Travel',label:'USCE travel',cost:800,paid:false},
    {id:uid(),cat:'Visa',label:'Visa application',cost:400,paid:false}];
  s.money.saved=[{id:uid(),date:d(-20),amt:300},{id:uid(),date:d(-10),amt:250},{id:uid(),date:d(-3),amt:300}];
  const mk=(day,off,sets)=>({id:uid(),date:d(off),day,sets});
  s.gym.logs=[
    mk('Push',-13,{'Incline DB press':[{w:28,r:10},{w:28,r:9},{w:28,r:8}],'Flat chest press':[{w:60,r:10},{w:60,r:9}]}),
    mk('Pull',-12,{'Lat pulldown':[{w:55,r:10},{w:55,r:10},{w:55,r:9}],'Seated cable row':[{w:50,r:12},{w:50,r:11}]}),
    mk('Push',-5,{'Incline DB press':[{w:30,r:9},{w:30,r:8},{w:30,r:8}],'Flat chest press':[{w:62.5,r:9},{w:62.5,r:8}]}),
    mk('Pull',-4,{'Lat pulldown':[{w:57.5,r:10},{w:57.5,r:9},{w:57.5,r:9}],'Seated cable row':[{w:52.5,r:12},{w:52.5,r:10}]})];
  s.gym.body=[{id:uid(),date:d(-21),kg:84.2,waist:89},{id:uid(),date:d(-14),kg:83.6,waist:88.5},{id:uid(),date:d(-7),kg:83.1,waist:88},{id:uid(),date:d(-1),kg:82.7,waist:87.5}];
  return s;
}
function freshState(){const s=baseState();return s}
/* ---------- state, storage ---------- */

function touch(){S.updatedAt=Date.now();persistLocal();dirty=true;clearTimeout(saveTimer);saveTimer=setTimeout(flush,700)}
async function flush(){
  if(!dbDoc||saving||!dirty)return;
  saving=true;dirty=false;
  try{await dbDoc.set(JSON.parse(JSON.stringify(S)));syncText='Saved to your account'}
  catch(e){syncText='Saved on this device only'}

function commit(msg){touch();render();if(msg)toast(msg)}

/* ---------- derived numbers ---------- */
const weekKeys=()=>[6,5,4,3,2,1,0].map(n=>addDays(TODAY,-n));
const studyOn=k=>sum((S.days[k]||{}).study||[],x=>x.min);
const uwOn=k=>{const a=S.usmle.uw.filter(x=>x.date===k);return{q:sum(a,x=>x.q),c:sum(a,x=>x.c)}};
const uwTotal=()=>({q:sum(S.usmle.uw,x=>x.q),c:sum(S.usmle.uw,x=>x.c)});
function systemStats(){
  const m={};
  S.usmle.uw.forEach(x=>{const o=m[x.system]||(m[x.system]={name:x.system,q:0,c:0});o.q+=x.q;o.c+=x.c});
  return Object.values(m).map(o=>({...o,p:pct(o.c,o.q)}));
}
const weakSystems=()=>systemStats().filter(x=>x.q>=20).sort((a,b)=>a.p-b.p).slice(0,3);
const examLeft=()=>S.usmle.examDate?daysBetween(TODAY,S.usmle.examDate):null;
function uwAccRange(from,to){
  const a=S.usmle.uw.filter(x=>x.date>=from&&x.date<=to);
  return a.length?pct(sum(a,x=>x.c),sum(a,x=>x.q)):null;
}
function weekly(){
  const ks=weekKeys();
  const studied=sum(ks,studyOn),goal=S.usmle.studyGoal*7;
  const thisAcc=uwAccRange(ks[0],ks[6]),prevAcc=uwAccRange(addDays(ks[0],-7),addDays(ks[0],-1));
  const sessions=ks.filter(k=>(S.days[k]||{}).workout).length;
  const logged=ks.filter(k=>(S.days[k]||{}).protein>0);
  const hit=logged.filter(k=>S.days[k].protein>=S.gym.protein*0.9).length;
  const fund=sum(S.money.saved.filter(x=>x.date>=ks[0]&&x.date<=ks[6]),x=>x.amt);
  return{ks,studied,goal,studyPct:clamp(pct(studied,goal),0,100),
    delta:(thisAcc!=null&&prevAcc!=null)?thisAcc-prevAcc:null,thisAcc,
    sessions,nutPct:logged.length?pct(hit,logged.length):0,loggedDays:logged.length,fund};
}
function schoolProgress(){
  const t=S.school.subjects.flatMap(s=>s.topics);
  return{done:t.filter(x=>x.done).length,total:t.length,p:pct(t.filter(x=>x.done).length,t.length)};
}
const savedTotal=()=>sum(S.money.saved,x=>x.amt);
const plannedTotal=()=>sum(S.money.items,x=>x.cost);
const paidTotal=()=>sum(S.money.items.filter(x=>x.paid),x=>x.cost);
const toneFor=p=>p>=75?'good':p>=45?'warn':'bad';

/* ---------- USMLE ---------- */
function ecg(){
  const pts=S.usmle.nbme.slice().sort((a,b)=>a.date<b.date?-1:1);
  if(pts.length<2)return '<div class="empty">Add two NBME scores to see your trace.</div>';
  const W=360,H=150,L=30,R=18,T=14,B=26,y0=30,y1=100,tgt=S.usmle.targetScore;
  const X=i=>L+(W-L-R)*(i/(pts.length-1)),Y=v=>T+(H-T-B)*(1-(clamp(v,y0,y1)-y0)/(y1-y0));
  const line=pts.map((p,i)=>(i?'L':'M')+X(i).toFixed(1)+' '+Y(p.score).toFixed(1)).join(' ');
  const ticks=[40,60,80,100].map(v=>'<text x="'+(L-6)+'" y="'+(Y(v)+4)+'" text-anchor="end" font-size="10" style="fill:var(--muted);font-family:var(--f-mono)">'+v+'</text>').join('');
  const dots=pts.map((p,i)=>'<circle cx="'+X(i).toFixed(1)+'" cy="'+Y(p.score).toFixed(1)+'" r="4.5" style="fill:var(--accent)"/><text x="'+X(i).toFixed(1)+'" y="'+(Y(p.score)-9).toFixed(1)+'" text-anchor="middle" font-size="11" font-weight="600" style="fill:var(--ink);font-family:var(--f-mono)">'+p.score+'</text><text x="'+X(i).toFixed(1)+'" y="'+(H-8)+'" text-anchor="middle" font-size="10" style="fill:var(--muted);font-family:var(--f-mono)">'+esc(fmtDate(p.date))+'</text>').join('');
  return '<div class="ecg"><svg viewBox="0 0 '+W+' '+H+'" role="img" aria-label="NBME scores over time">'+ticks+
    '<line x1="'+L+'" x2="'+(W-R)+'" y1="'+Y(tgt).toFixed(1)+'" y2="'+Y(tgt).toFixed(1)+'" stroke-dasharray="4 4" stroke-width="1.5" style="stroke:var(--good)"/>'+
    '<text x="'+(W-R)+'" y="'+(Y(tgt)-5).toFixed(1)+'" text-anchor="end" font-size="10" style="fill:var(--good);font-family:var(--f-mono)">target '+tgt+'</text>'+
    '<path d="'+line+'" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round" style="stroke:var(--accent)"/>'+dots+'</svg></div>';
}

    (nb.length?'<div class="scroll-x" style="margin-top:8px"><table><thead><tr><th>Exam</th><th>Date</th><th class="num-c">Score</th><th></th><th></th></tr></thead><tbody>'+nb.slice().reverse().map(n=>'<tr><td>'+esc(n.name)+'</td><td>'+esc(fmtDate(n.date))+'</td><td class="num-c mono">'+n.score+'%</td><td><button type="button" class="btn small" data-act="askPrefill" data-q="'+esc('I got '+n.score+'% on '+n.name+(n.weak?' (weak areas: '+n.weak+')':'')+'. What should I focus on over the next 2 weeks?')+'">Analyze</button></td><td>'+delBtn('usmle.nbme',n.id,n.name)+'</td></tr>').join('')+'</tbody></table></div>':'')+

    (weak.length?'<div class="stack">'+weak.map(x=>'<div class="stack" style="gap:6px"><div class="row between"><span>'+esc(x.name)+'</span><span class="mono small">'+x.p+'% · '+x.q+' Q</span></div>'+bar(x.p,toneFor(x.p))+'</div>').join('')+'</div>':'<div class="empty">Log at least 20 questions in a system to see it here.</div>')+
    '<div style="margin-top:10px"><button type="button" class="btn small" data-act="askPrefill" data-q="Here are my weak systems. Build me a 3-day plan to fix them.">Plan a fix with Claude</button></div>'+
  '</section>'+

function spark(arr,key,unit){
  if(arr.length<2)return '';

function shrink(file,max){return new Promise((res,rej)=>{
  const url=URL.createObjectURL(file),img=new Image();
  img.onload=()=>{const k=Math.min(1,max/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);c.toBlob(b=>b?res(b):rej(new Error('encode')),'image/jpeg',0.82)};
  img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('decode'))};
  img.src=url;
})}

  cl.use('sample').then(f=>{if(f){samp=f;$('#askBtn').hidden=false;render()}}).catch(()=>{});
  try{
    const [db,user]=await Promise.all([cl.use('db'),cl.use('user')]);
    if(!db||!user)return;
    const id=await user.id();if(!id)return;
    dbDoc=db.doc('data/users/'+id+'/state');
    const snap=await dbDoc.get();
    if(snap.exists&&(snap.data().updatedAt||0)>(S.updatedAt||0)){
      S=JSON.parse(JSON.stringify(snap.data()));persistLocal();syncText='Saved to your account';render();
    }else{dirty=true;await flush()}
    paintSub();
    dbDoc.onSnapshot(sn=>{
      if(sn.metadata.hasPendingWrites||!sn.exists)return;
      const r=sn.data();
      if((r.updatedAt||0)>(S.updatedAt||0)){S=JSON.parse(JSON.stringify(r));persistLocal();render()}
    },()=>{});
  }catch(e){syncText='Saved on this device only';paintSub()}
})();

})();
if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0){window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})})}
</script>
